<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>svg-grabber</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="layout-grid">
    <header class="header">
      <h1 class="logo">
        <picture>
          <source srcset="logo-for-dark.svg" media="(prefers-color-scheme: dark)" />
          <source srcset="logo-for-light.svg" media="(prefers-color-scheme: light)" />
          <img src="logo-for-light.svg" alt="svg-grabber" />
        </picture>
        <span class="sr-only">svg-grabber</span>
      </h1>
      <a id="sender-url" class="sender-url" href="">Source page</a>
      <div class="controls hidden">
        <button>Light</button>
        <div class="preview-controls">
          <label class="sr-only" for="preview-bg">Background brightness</label>
          <span id="preview-bg-light-label" class="sr-only">White</span>
          <input
            id="preview-bg"
            type="range"
            min="0"
            max="100"
            value="100"
            step="1"
            aria-describedby="preview-bg-light-label preview-bg-dark-label"
          />
          <span id="preview-bg-dark-label" class="sr-only">Black</span>
        </div>
        <button class="btn btn-accent btn-large btn-download-all">
          Download all SVGs
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 15V3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>
    <main class="container">
      <div class="source-section">
        <div class="source-header">
          <h2 class="source-title">
            <span id="sender-url-secondary" class="sender-url">Source page</span>
          </h2>
          <div class="svg-tooltip-anchor">
            <button
              class="btn btn-icon"
              style="anchor-name: --anchor-btn-2; --icon-size: 1rem"
              popovertarget="my-tooltip-2"
              type="button"
              aria-describedby="my-tooltip-2"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4M12 8h.01" />
              </svg>

              <span class="sr-only">Open Tooltip</span>
            </button>
            <div
              id="my-tooltip-2"
              class="svg-tooltip svg-tooltip-large svg-tooltip-right"
              style="position-anchor: --anchor-btn-2"
              popover
              role="tooltip"
            >
              <p>
                Some logos and artwork are protected by copyright or trademark. You may download
                them freely, but use requires proper permission from the rights holder.
              </p>
            </div>
          </div>
        </div>
        <p>
          <span id="svg-count" class="text-small">0</span>
        </p>
      </div>
      <div id="gallery-svg" class="svg-grid"></div>
      <input class="clipboard hidden" />
    </main>
    <footer class="footer">
      By <a href="https://www.juanrios.me/" target="_blank" rel="noopener">Juan Rios</a>
    </footer>
    <script type="module" src="manager.js"></script>
  </body>
</html>
