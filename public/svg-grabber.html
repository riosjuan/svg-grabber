<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>svg-grabber</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="layout-grid">
    <header class="header">
      <div class="logo">
        <div class="logo__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <g fill="none" fill-rule="evenodd">
              <path
                fill="#FFF"
                d="M12 23v7h3v3h3v6h3v3h3v3h3v3h13v-3h3v3h3v-6h3v-7h3V23h-4v3h-3v-6h-4v4h-3v-7h-6l-.25 7H29v-4h-4v9h-3v-3h-4v-3"
              />
              <path
                fill="currentColor"
                d="M22 23h-4v3h4v3h3V17h-3v6zm19-6h4v3h-4v-3zm-29 3h6v3h-6v-3zm17-3h3v7h-3v-7zm0 13h3v12h-3V30zM9 23h3v7H9v-7zm3 7h3v3h-3v-3zm6 9h3v3h-3v-3zm3 3h3v3h-3v-3zm19 3h3v3h-3v-3zm3 3h3v3h-3v-3zm-16 0h13v3H27v-3zm-3-3h3v6h-3v-6zm-9-12h3v6h-3v-6zm20-3h3v12h-3V30zm6 0h3v12h-3V30zm5 12h3v9h-3v-9zm3-7h3v7h-3v-7zM38 17h3v7h-3v-7zm7 0h3v9h-3v-9zm3 3h4v3h-4v-3zm4 0h3v15h-3V20zm-27-3h4v3h-4v-3zm7-3h6v3h-6v-3z"
              />
            </g>
          </svg>
        </div>
        <p class="logo__text">svg-grabber</p>
      </div>
      <div class="header-divider"></div>
      <a id="sender-url" class="sender-url" href=""></a>
      <div class="controls">
        <div class="preview-controls hidden">
          <label for="preview-bg"> Preview background </label>
          <input
            id="preview-bg"
            type="range"
            min="90"
            max="100"
            value="100"
            step="1"
            aria-label="Preview background brightness"
          />
        </div>
        <button class="btn btn-accent btn-large hidden btn-download-all">
          Download all SVGs
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 15V3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>
    <main class="container">
      <div class="disclaimer-alert" role="alert">
        <p class="disclaimer">
          Some of the logos design and the artwork you are about to download are the intellectual
          property of the copyright and/or trademark holder and are offered to you as a convenience
          for lawful use with proper permission from the copyright and/or trademark holder only.
        </p>
        <button
          class="btn btn-icon disclaimer-dismiss"
          type="button"
          aria-label="Dismiss disclaimer"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M18 6L6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6 6L18 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <div id="gallery-svg" class="svg-grid"></div>
      <input class="clipboard hidden" />
    <main/>

    <footer class="footer">by <a href="https://x.com/juanriosnl">@juanriosnl</a></footer>
    <script type="module" src="svg-manager.js"></script>
  </body>
</html>
