<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>svg-grabber</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="layout-grid">
    <header class="header">
      <h1 class="logo">
        <img src="logo.svg" alt="svg-grabber" />
        <span class="sr-only">svg-grabber</span>
      </h1>
      <a id="sender-url" class="sender-url" href="">Source page</a>
      <div class="controls">
        <div class="preview-controls">
          <label class="sr-only" for="preview-bg">Background brightness</label>
          <span class="sr-only">Light</span>
          <input
            id="preview-bg"
            type="range"
            min="0"
            max="100"
            value="100"
            step="1"
            aria-label="Preview background brightness"
          />
          <span class="sr-only">Dark</span>
        </div>
        <button class="btn btn-accent btn-large btn-download-all">
          Download all SVGs
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 15V3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>
    <main class="container">
      <div class="source-section" style="margin-block-end: var(--spacing)">
        <h2 class="source-title">
          <span id="sender-url-secondary" class="sender-url">Source page</span>
          <div class="svg-tooltip-anchor">
            <button
              class="btn btn-icon"
              style="anchor-name: --anchor-btn-2; --icon-size: 1rem"
              popovertarget="my-tooltip-2"
              type="button"
              aria-describedby="my-tooltip-2"
            >
              <p aria-hidden="true">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 16v-4M12 8h.01" />
                </svg>
              </p>
              <p class="sr-only">Open Tooltip</p>
            </button>
            <div
              id="my-tooltip-2"
              class="svg-tooltip svg-tooltip-right"
              style="position-anchor: --anchor-btn-2"
              popover
              role="tooltip"
            >
              <p>
                Some logos and artwork are protected by copyright or trademark. You may download
                them freely, but use requires proper permission from the rights holder.
              </p>
            </div>
          </div>
        </h2>
        <p>
          <span id="svg-count" class="text-small">0</span>
        </p>
      </div>
      <div id="gallery-svg" class="svg-grid"></div>
      <input class="clipboard hidden" />
    </main>
    <footer class="footer">By <a href="https://juanrios.me/">Juan Rios</a></footer>
    <script type="module" src="svg-manager.js"></script>
  </body>
</html>
