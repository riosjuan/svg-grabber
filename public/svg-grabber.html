<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>svg-grabber</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="layout-grid">
    <header class="header">
      <h1 class="logo">
        <img src="logo.svg" alt="svg-grabber" />
        <span class="sr-only">svg-grabber</span>
      </h1>
      <a id="sender-url" class="sender-url" href="">Source page</a
      ><span id="svg-count" class="svg-count">0</span>
      <div class="controls">
        <div class="preview-controls">
          <span>Light</span>
          <input
            id="preview-bg"
            type="range"
            min="90"
            max="100"
            value="100"
            step="1"
            aria-label="Preview background brightness"
          />
          <span>Dark</span>
        </div>
        <button class="btn btn-accent btn-large btn-download-all">
          Download all SVGs
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 15V3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>
    <main class="container">
      <div class="disclaimer-alert hidden" role="alert">
        <div>
          <p class="font-bold">Copyright & trademark notice</p>
          <p class="font-small">
            Some logos and artwork are protected by copyright or trademark. You may download them
            freely, but use requires proper permission from the rights holder.
          </p>
        </div>
        <button
          class="btn btn-icon disclaimer-dismiss"
          type="button"
          aria-label="Dismiss disclaimer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M18 6 6 18M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div id="gallery-svg" class="svg-grid"></div>
      <input class="clipboard hidden" />
    </main>
    <footer class="footer">By <a href="https://juanrios.me/">Juan Rios</a></footer>
    <script type="module" src="svg-manager.js"></script>
  </body>
</html>
